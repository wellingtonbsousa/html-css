<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídeas em HTML5</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do navegador.</p>
    <picture>
        <!-- O source deve ter a ordem do menor pro maior para que surta efeito da troca conforme a modificação do tamanho da tela -->
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">        
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5</p>
    <!-- <audio src="midia/Summer Shower - Quincas Moreira.mp3" controls autoplay></audio> -->

    <audio preload="metadata" controls loop> <!-- pode usar autoplay (perigoso no preload pois pesa para carregar o site) -->
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
        <source src="midia/guanacast-33.ogg" type="audio/ogg">
        <source src="midia/guanacast-33.wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/guanacast-33.mp3">Clique aquí para baixar o arquivo MP3</a></p>
    </audio>
</body>
</html>
