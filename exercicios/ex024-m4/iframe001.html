<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe { /* as configuracoes dos CSS são soberanas */
            height: 400px;
            width: 400px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de iframe</h1>

    <p>Acessando o site do 
        <!-- tamanho padrao 300x150px -->
        <iframe src="https://www.cursoemvideo.com" frameborder="0" scrolling="no">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a> <!-- Só aparece se o dispositivo não tiver suporte ao iframe -->
        </iframe>
        
    para aprender a programar.
    </p>

    <p>
        O repositório do 

        <iframe src="https://gustavoguanabara.github.io" frameborder="0">
            <a href="https://gustavoguanabara.github.io"> no GitHub</a>
        </iframe>

        também é muito legal.
    </p>
    
</body>
</html>
